# Local development database only. Credentials here are for localhost, not real secrets.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
